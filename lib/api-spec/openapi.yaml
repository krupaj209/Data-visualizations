        perSubcategoryMerged:
          type: array
          description: |
            Populated only when `scope.kind == "category"`. One entry per
            subcategory in the category, each carrying that subcategory's
            merged bundles after applying its own category-scope overrides.
          items:
            type: object
            properties:
              subcategoryId: { type: string }
              mergedBundles:
                type: array
                items: { $ref: "#/components/schemas/MergedQuestionBundle" }
            required: [subcategoryId, mergedBundles]
      required:
        - archetypes
        - intents
        - bundles
        - pageTemplates
        - subcategories
        - scope
        - mergedBundles
        - categoryOverrides
        - ceOverrides
    QuestionOverrideMutationResult:
      type: object
      description: |
        Returned by every CRUD endpoint so the UI doesn't need a follow-up
        fetch. Contains the freshly merged bank for the affected scope plus
        the row that was just created/updated (omitted on delete).
      properties:
        view: { $ref: "#/components/schemas/QuestionBankView" }
        categoryOverride:
          oneOf:
            - $ref: "#/components/schemas/QuestionCategoryOverride"
            - type: "null"
        ceOverride:
          oneOf:
            - $ref: "#/components/schemas/QuestionCeOverride"
            - type: "null"
      required:
        - view
