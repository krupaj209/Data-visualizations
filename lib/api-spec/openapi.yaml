openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ces
    description: Combined Entity (attraction/experience) operations
  - name: charts
    description: Chart operations
  - name: drds
    description: Deep Research Document upload and retrieval
  - name: research
    description: Research-grounded chart generation pipeline
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ces:
    get:
      operationId: listCes
      tags: [ces]
      summary: List all CEs
      responses:
        "200":
          description: List of CEs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ce"
    post:
      operationId: createCe
      tags: [ces]
      summary: Create a CE and generate its chart suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}:
    get:
      operationId: getCe
      tags: [ces]
      summary: Get a CE with its charts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CE with charts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCe
      tags: [ces]
      summary: Delete a CE and its charts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/regenerate:
    post:
      operationId: regenerateCe
      tags: [ces]
      summary: Replace this CE's charts with a freshly generated set
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds/{ceSlug}:
    get:
      operationId: getDrd
      tags: [drds]
      summary: Get the latest DRD uploaded for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DRD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDrd
      tags: [drds]
      summary: Delete the DRD for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds:
    post:
      operationId: uploadDrd
      tags: [drds]
      summary: Upload or replace the DRD for a CE (markdown JSON or PDF multipart)
      description: |
        Two ways to upload:
          1. application/json with `{ ceSlug, markdown, sourceFilename?, sources? }`
          2. multipart/form-data with `ceSlug` and a `file` field (PDF). The
             multipart variant is intentionally omitted from the OpenAPI spec
             because Orval's Zod generator can't model a binary `Blob` body in
             a Node typecheck context. Use plain `fetch` with `FormData` for
             PDF uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrdMarkdownUpload"
      responses:
        "201":
          description: Created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /research/subcategories:
    get:
      operationId: listSubcategories
      tags: [research]
      summary: List the supported subcategories with their descriptions
      responses:
        "200":
          description: Subcategory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
  /research/generate:
    post:
      operationId: generateFromResearch
      tags: [research]
      summary: Run the research-grounded pipeline to produce a draft deck
      description: |
        Subcategory ids that aren't in the curated bank are accepted and
        bootstrapped as `unratified` — only cross-cutting and DRD-derived
        hero questions are used. Locked curated CEs (Florence cluster)
        return 409 to protect their hand-curated decks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchGenerateInput"
      responses:
        "201":
          description: Draft deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchGenerateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for the CE yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Pipeline failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}:
    get:
      operationId: getChart
      tags: [charts]
      summary: Get a single chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Ce:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        country:
          type: string
        category:
          type: string
        summary:
          type: string
        emoji:
          type: string
        status:
          type: string
        chartCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - name
        - city
        - country
        - category
        - summary
        - emoji
        - status
        - chartCount
        - createdAt
        - updatedAt
    Chart:
      type: object
      properties:
        id:
          type: integer
        ceId:
          type: integer
        slug:
          type: string
        question:
          type: string
        title:
          type: string
        subtitle:
          type: string
        insight:
          type: string
        chartType:
          type: string
        spec:
          type: object
          additionalProperties: true
        status:
          type: string
        provenance:
          type: object
          nullable: true
          additionalProperties: true
        sortOrder:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ceId
        - slug
        - question
        - title
        - subtitle
        - insight
        - chartType
        - spec
        - sortOrder
        - createdAt
        - updatedAt
    ChartWithCe:
      type: object
      properties:
        chart:
          $ref: "#/components/schemas/Chart"
        ce:
          $ref: "#/components/schemas/Ce"
      required:
        - chart
        - ce
    CeWithCharts:
      type: object
      properties:
        ce:
          $ref: "#/components/schemas/Ce"
        charts:
          type: array
          items:
            $ref: "#/components/schemas/Chart"
      required:
        - ce
        - charts
    Drd:
      type: object
      properties:
        id:
          type: integer
        ceSlug:
          type: string
        sourceType:
          type: string
        sourceFilename:
          type: string
          nullable: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        markdownPreview:
          type: string
        markdownLength:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ceSlug
        - sourceType
        - sources
        - markdownPreview
        - markdownLength
        - createdAt
        - updatedAt
    DrdMarkdownUpload:
      type: object
      properties:
        ceSlug:
          type: string
        markdown:
          type: string
        sourceFilename:
          type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - ceSlug
        - markdown
    Subcategory:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
      required:
        - id
        - label
        - description
    ResearchGenerateInput:
      type: object
      properties:
        ceSlug:
          type: string
        subcategoryId:
          type: string
        subcategoryLabel:
          type: string
        subcategoryDescription:
          type: string
        name:
          type: string
        city:
          type: string
        country:
          type: string
        category:
          type: string
        writerTopics:
          type: array
          items:
            type: string
      required:
        - ceSlug
        - subcategoryId
    ResearchGenerateResult:
      type: object
      properties:
        ce:
          $ref: "#/components/schemas/Ce"
        charts:
          type: array
          items:
            $ref: "#/components/schemas/Chart"
        publishedChartsKept:
          type: integer
        droppedQuestions:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              reason:
                type: string
            required: [question, reason]
        proposedHeroQuestions:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - ce
        - charts
        - publishedChartsKept
        - droppedQuestions
        - proposedHeroQuestions
    CeInput:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        country:
          type: string
        category:
          type: string
      required:
        - name
        - city
        - country
