    RegenerateCeInput:
      type: object
      properties:
        feedback:
          type: string
          description: |
            Optional free-text writer feedback. Parsed by the api-server
            into structured constraints (banned archetypes / topics /
            phrases, must-include topics) and merged with whatever was
            persisted from prior regen runs on the same CE.
        pageType:
          type: string
          enum:
            - plan-your-visit
            - skip-the-line
            - entrances
            - history
            - map-floor-plan
            - reviews-experiences
            - combo-deals
          description: |
            Listing-page template the assembler should build the deck for.
            Defaults to plan-your-visit when omitted.
        customChartMode:
          type: string
          enum:
            - keep
            - replace
          description: |
            How to handle writer-added "custom" charts (drafts whose
            provenance.origin is set by `POST /ces/:slug/charts`, e.g.
            `topic_to_chart`). `keep` (default) preserves them and only
            replaces AI-assembled drafts; `replace` wipes every draft as
            the legacy behaviour did. Published charts are always kept.
      required: []
    RegenSummary:
      type: object
      description: |
        Surfaced by /ces/{slug}/regenerate so the writer can confirm the
        run honored their feedback. Plain-English bullets first, then the
        structured signals so the UI can render either.
      properties:
        honoredFeedback:
          type: array
          items:
            type: string
        suppressedArchetypes:
          type: array
          items:
            type: string
        retiredTopics:
          type: array
          items:
            type: string
        priorDeckOverlap:
          type: integer
          description: How many selected questions overlap the prior deck.
        priorDeckSize:
          type: integer
          description: Total prior charts considered.
        storedConstraints:
          type: object
          additionalProperties: true
          description: |
            Merged constraint set (parsed feedback ∪ prior persisted
            constraints) re-persisted on the CE row this run. Surfaced so
            the UI can show the writer what's "sticky" for next regen.
      required:
        - honoredFeedback
        - suppressedArchetypes
        - retiredTopics
        - priorDeckOverlap
        - priorDeckSize
        - storedConstraints
    RegenerateCeResult:
      type: object
      properties:
