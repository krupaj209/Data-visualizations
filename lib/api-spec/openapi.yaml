        charts:
          type: array
          items:
            $ref: "#/components/schemas/Chart"
        publishedChartsKept:
          type: integer
          description: |
            Count of `published` charts preserved across the run (only
            `draft` rows are deleted by the research pipeline).
        customChartsKept:
          type: integer
          description: |
            Count of writer-added "custom" draft charts preserved across
            this run. Always 0 when `customChartMode` was `replace`.
        customChartMode:
          type: string
