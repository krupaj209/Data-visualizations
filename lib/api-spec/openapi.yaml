          type: string
        kind:
          type: string
          description: |
            Turn kind — `"chat"` for free-form ideation turns, `"topic"`
            for the structured topic-to-chart flow. Defaults to "chat".
        proposals:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        feasibility:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FeasibilityVerdict"
