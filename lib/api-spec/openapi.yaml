openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ces
    description: Combined Entity (attraction/experience) operations
  - name: charts
    description: Chart operations
  - name: drds
    description: Deep Research Document upload and retrieval
  - name: research
    description: Research-grounded chart generation pipeline
  - name: feedback
    description: Chart feedback loop and triage
  - name: ce-intelligence
    description: Per-CE intelligence profile built from multi-source adapters
  - name: question-bank
    description: Read the merged question bank and CRUD per-scope overrides
paths:
  /question-bank:
    get:
      operationId: getQuestionBank
      tags: [question-bank]
      summary: Read the merged question bank (code defaults + active overrides)
      description: |
        Returns the registry snapshot plus a merged-bundles view that
        composes code defaults with active category and CE overrides.

        Filters are exclusive in precedence: `ceSlug` > `subcategoryId` >
        `categoryId`. With no filters, only code defaults are returned.

        When `ceSlug` is given, the CE row's inferred subcategoryId is used
        to apply category-scope overrides as well. The `categoryOverrides`
        and `ceOverrides` arrays return the raw rows that were applied to
        the merge, so the editor UI can list and revert them without a
        second fetch.

        **Category-scope contract**: when filtering by `categoryId` alone,
        the top-level `mergedBundles` returns code defaults only —
        overrides from different subcategories in the same category cannot
        be sensibly collapsed into a single merge. Clients must read
        `perSubcategoryMerged` (one entry per subcategory in the category)
        for the effective merged data at category scope. `categoryOverrides`
        still returns every raw row in the category for editor list views.
      parameters:
        - in: query
          name: categoryId
          required: false
          schema: { type: integer }
        - in: query
          name: subcategoryId
          required: false
          schema: { type: string }
        - in: query
          name: ceSlug
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Merged bank view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankView"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /question-bank/category-overrides:
    post:
      operationId: createCategoryOverride
      tags: [question-bank]
      summary: Create a category-scope override (one bundle candidate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCategoryOverrideInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /question-bank/category-overrides/{id}:
    patch:
      operationId: updateCategoryOverride
      tags: [question-bank]
      summary: Edit an existing category-scope override row
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCategoryOverridePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCategoryOverride
      tags: [question-bank]
      summary: Revert (delete) a category-scope override row
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted (returns the freshly merged view for the affected subcategory)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /question-bank/category-overrides:bulk:
    post:
      operationId: bulkApplyCategoryOverride
      tags: [question-bank]
      summary: Apply one override across every subcategory in a category
      description: |
        Idempotent upsert on the
        `(subcategoryId, bundleId, archetype, action)` unique tuple. Returns
        the count of rows touched and the full set of override rows now
        active for that category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCategoryOverrideBulkInput"
      responses:
        "200":
          description: Bulk apply summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCategoryOverrideBulkResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: bulkRevertCategoryOverride
      tags: [question-bank]
      summary: Delete all matching overrides across every subcategory in a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCategoryOverrideBulkDeleteInput"
      responses:
        "200":
          description: Bulk revert summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCategoryOverrideBulkResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /question-bank/ce-overrides:
    post:
      operationId: createCeOverride
      tags: [question-bank]
      summary: Create a CE-scope override (one bundle candidate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCeOverrideInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /question-bank/ce-overrides/{id}:
    patch:
      operationId: updateCeOverride
      tags: [question-bank]
      summary: Edit an existing CE-scope override row
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionCeOverridePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCeOverride
      tags: [question-bank]
      summary: Revert (delete) a CE-scope override row
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted (returns the freshly merged view for the affected CE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionOverrideMutationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ces:
    get:
      operationId: listCes
      tags: [ces]
      summary: List all CEs
      description: |
        Returns live CEs by default (excludes soft-deleted rows). Pass
        `?archived=true` to list only soft-deleted CEs for the Archive
        tab, ordered most-recently-archived first.
      parameters:
        - in: query
          name: archived
          required: false
          schema:
            type: boolean
          description: |
            When true, return only soft-deleted (archived) CEs. When
            false or omitted, return only live CEs.
      responses:
        "200":
          description: List of CEs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ce"
    post:
      operationId: createCe
      tags: [ces]
      summary: Create a CE and generate its chart suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}:
    get:
      operationId: getCe
      tags: [ces]
      summary: Get a CE with its charts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: CE with charts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCe
      tags: [ces]
      summary: Soft-delete (archive) a CE
      description: |
        Soft-deletes the CE by stamping `archivedAt`. The row stops
        appearing in the default library list but can be restored
        from the Archive tab via `POST /ces/{slug}/restore`. Locked
        curated CEs refuse the operation with 409.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Archived
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is curated/locked and cannot be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/permanent:
    delete:
      operationId: permanentDeleteCe
      tags: [ces]
      summary: Permanently delete an archived CE
      description: |
        Hard-deletes an archived CE and all associated data (charts, DRDs,
        intelligence). The slug is freed immediately and can be reused.
        Only archived CEs may be permanently deleted — live CEs must be
        archived first. Locked curated CEs refuse the operation with 409.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Permanently deleted
        "404":
          description: CE not found or not archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked or must be archived before permanent deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/restore:
    post:
      operationId: restoreCe
      tags: [ces]
      summary: Restore a soft-deleted CE
      description: |
        Clears `archivedAt` on a previously archived CE so it
        reappears in the default library list. Charts/DRDs/feedback
        survive archival untouched, so they come back as-is.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ce:
                    $ref: "#/components/schemas/Ce"
                required: [ce]
        "404":
          description: Archived CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/regenerate:
    post:
      operationId: regenerateCe
      tags: [ces]
      summary: Replace this CE's charts with a freshly generated set
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateCeInput"
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateCeResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds/{ceSlug}:
    get:
      operationId: getDrd
      tags: [drds]
      summary: Get the latest DRD uploaded for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DRD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDrd
      tags: [drds]
      summary: Delete the DRD for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds:
    post:
      operationId: uploadDrd
      tags: [drds]
      summary: Upload or replace the DRD for a CE (markdown JSON or PDF multipart)
      description: |
        Two ways to upload:
          1. application/json with `{ ceSlug, markdown, sourceFilename?, sources? }`
          2. multipart/form-data with `ceSlug` and a `file` field (PDF). The
             multipart variant is intentionally omitted from the OpenAPI spec
             because Orval's Zod generator can't model a binary `Blob` body in
             a Node typecheck context. Use plain `fetch` with `FormData` for
             PDF uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrdMarkdownUpload"
      responses:
        "201":
          description: Created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /research/subcategories:
    get:
      operationId: listSubcategories
      tags: [research]
      summary: List the supported subcategories with their descriptions
      responses:
        "200":
          description: Subcategory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
  /research/generate:
    post:
      operationId: generateFromResearch
      tags: [research]
      summary: Run the research-grounded pipeline to produce a draft deck
      description: |
        Subcategory ids that aren't in the curated bank are accepted and
        bootstrapped as `unratified` — only cross-cutting and DRD-derived
        hero questions are used. Locked curated CEs (Florence cluster)
        return 409 to protect their hand-curated decks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchGenerateInput"
      responses:
        "201":
          description: Draft deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchGenerateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for the CE yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Pipeline failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}:
    get:
      operationId: getCeIntelligence
      tags: [ce-intelligence]
      summary: Get the persisted intelligence profile for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Intelligence profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "404":
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}/refresh:
    post:
      operationId: refreshCeIntelligence
      tags: [ce-intelligence]
      summary: Refresh the intelligence profile (all sources or a subset)
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeIntelligenceRefreshInput"
      responses:
        "200":
          description: Refreshed profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}/recheck-gap:
    post:
      operationId: recheckCeIntelligenceGap
      tags: [ce-intelligence]
      summary: Targeted multi-query recheck of a rejected planner idea
      description: >-
        Derives 1–3 missing-evidence buckets from the rejection reason and
        archetype data shape, fans out one Gemini+googleSearch call per
        bucket, merges findings, and re-scores the idea editorially. The
        deterministic ship/hold/cut verdict drives whether the rejected
        idea is promoted into the saved plan's recommended list.
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecheckGapRequest"
      responses:
        "200":
          description: Recheck outcome (and updated plan when applicable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecheckGapResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}/sources/{source}:
    delete:
      operationId: deleteCeIntelligenceSource
      tags: [ce-intelligence]
      summary: Drop all facts attributed to a single source
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
        - in: path
          name: source
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "400":
          description: Invalid source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}:
    get:
      operationId: getChart
      tags: [charts]
      summary: Get a single chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateChart
      tags: [charts]
      summary: Writer edits a chart's header copy and/or spec
      description: |
        Updates title/subtitle/insight and logs a chart_edits row. The edit
        row counts as a 0.25-weight implicit signal in the trouble score.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartUpdateInput"
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid spec or fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE has a hand-curated chart set and cannot be edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/regenerate:
    post:
      operationId: regenerateChart
      tags: [charts]
      summary: Regenerate the spec for a single chart
      description: |
        Re-runs the research pipeline for just this chart, replacing its spec
        in place. Requires a DRD uploaded for the CE. Locked CEs return 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateFeedbackInput"
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated regeneration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for the CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Pipeline failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/regenerate-suggested-content:
    post:
      operationId: regenerateSuggestedContent
      tags: [charts]
      summary: Regenerate the hourly_heatmap highlight_cards via Gemini + DRD
      description: |
        Ask Gemini for a fresh `highlight_cards` array for an
        `hourly_heatmap` chart, grounded in the CE's DRD. Validates against
        the `HourlyHeatmapSpec.highlight_cards` schema and persists in
        place. Returns the full updated chart. Locked CEs return 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated regeneration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for this CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Chart is not an hourly_heatmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/verify:
    post:
      operationId: verifyChart
      tags: [charts]
      summary: Re-verify the chart against the CE's DRD + a fresh web check
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartVerification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for this CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/feedback:
    get:
      operationId: listChartFeedback
      tags: [feedback]
      summary: List feedback for a single chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartFeedback"
    post:
      operationId: createChartFeedback
      tags: [feedback]
      summary: Submit feedback on a chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartFeedbackInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartFeedback"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Chart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/publish:
    post:
      operationId: publishChart
      tags: [charts]
      summary: Flip a draft chart to published (or back to draft)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartPublishInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/fact-reviews:
    post:
      operationId: upsertChartFactReview
      tags: [charts]
      summary: Approve, reject, or flag a single fact-table row on a chart
      description: |
        Persists a writer's review decision for a single fact-table row onto
        the chart's `provenance.fact_reviews` map. Use `claimOverride` and
        `valueOverride` to override the auto-generated claim/value text.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartFactReviewInput"
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/fact-reviews/{rowId}:
    delete:
      operationId: clearChartFactReview
      tags: [charts]
      summary: Clear a single writer review decision from the fact table
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: rowId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/charts:
    post:
      operationId: createChartFromTopic
      tags: [charts]
      summary: Generate a new draft chart for a CE from a writer's topic
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicChartInput"
      responses:
        "201":
          description: Draft chart created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: |
            Topic matches an existing chart on the same CE. Body carries
            the matched chart so the UI can offer Open / Merge / Create-
            anyway. Resubmit with `force: true` to bypass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateChartPayload"
        "502":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/merge-suggestion:
    post:
      operationId: mergeChartSuggestion
      tags: [charts]
      summary: Fold writer-provided inputs into an existing chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeSuggestionInput"
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid input or nothing to merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Chart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated edits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /feedback:
    get:
      operationId: listAllFeedback
      tags: [feedback]
      summary: List feedback across all charts (for triage)
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Triage feedback rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriageFeedback"
  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Update a feedback row's status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartFeedback"
        "404":
          description: Not found
  /ces/{slug}/publish-all-drafts:
    post:
      operationId: publishAllDrafts
      tags: [charts]
      summary: Bulk-publish every draft chart for a CE
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAllDraftsInput"
      responses:
        "200":
          description: Bulk publish summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishAllDraftsResult"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/verify-all:
    post:
      operationId: verifyAllCharts
      tags: [charts]
      summary: Bulk-verify every unverified chart for a CE
      description: |
        Runs the OpenAI verifier concurrently on all charts that do not yet
        have a `verifier_notes` entry in provenance.  Returns immediately when
        all jobs finish.  Blocked for locked/curated CEs (409).
        If the OpenAI integration is not configured, returns 200 with
        `verified: 0` and a human-readable `reason`.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bulk-verify summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyAllResult"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Locked CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/regenerate-stale:
    post:
      operationId: regenerateStaleCharts
      tags: [charts]
      summary: Regenerate charts whose spec predates the CE's current DRD
      description: |
        Identifies stale charts by comparing `provenance.generated_at` (falling
        back to `chart.createdAt`) against the DRD's `updatedAt`.  Regenerates
        each stale chart serially using the same per-archetype Gemini pipeline
        and stamps a fresh `generated_at` on provenance.
        Returns 412 when no DRD has been uploaded.
        Blocked for locked/curated CEs (409).
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Regenerate-stale summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegenerateStaleResult"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Locked CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: One or more charts failed to regenerate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/ideation:
    get:
      operationId: getIdeation
      tags: [ces]
      summary: Get the ideation chatbot transcript for a CE
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeationMessage"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: postIdeation
      tags: [ces]
      summary: Send a writer message to the ideation chatbot
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeationInput"
      responses:
        "200":
          description: Assistant reply (with optional structured proposals)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeationMessage"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Ideation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearIdeation
      tags: [ces]
      summary: Clear the ideation chatbot transcript
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cleared
  /ces/{slug}/ideation/feasibility:
    post:
      operationId: postIdeationFeasibility
      tags: [ces]
      summary: Check whether the CE has enough evidence for a chart topic
      description: |
        Topic-to-chart entry point. Persists a user turn (the topic + any
        one-shot context) and an assistant turn whose `feasibility` field
        carries a structured verdict (`ready` | `needs_more` |
        `out_of_scope`) plus the specific missing data points the writer
        should supply when more evidence is needed.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Accepts `application/json` with `IdeationFeasibilityInput`. A
          `multipart/form-data` variant with the same `topic` + optional
          `contextText` + `contextPdf` file exists at runtime for PDF
          uploads but is intentionally omitted from the spec because
          Orval's Zod generator can't model `Blob` bodies — call it via
          `fetch` + `FormData` from the client (mirrors the existing
          `POST /ces/{slug}/ideation` PDF upload pattern).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeationFeasibilityInput"
      responses:
        "200":
          description: Assistant turn carrying the feasibility verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeationMessage"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Feasibility check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/ideation/generate-chart:
    post:
      operationId: postIdeationGenerateChart
      tags: [ces]
      summary: Generate a draft chart from an approved ideation topic
      description: |
        Runs the existing per-archetype research pipeline for a single
        topic+question+archetype, inserts the result as a draft chart
        whose provenance ties back to the ideation turn that produced
        it, and appends a confirmation message to the transcript.
        Locked Florence CEs reject this with 409, mirroring regenerate.
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeationGenerateChartInput"
      responses:
        "200":
          description: The new draft chart + the confirmation transcript turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeationGeneratedChart"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Locked CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Chart generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /triage/questions:
    get:
      operationId: listQuestionTroubleScores
      tags: [feedback]
      summary: List per-question trouble scores aggregated from feedback
      responses:
        "200":
          description: Trouble scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionTroubleScore"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Ce:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        country:
          type: string
        category:
          type: string
        summary:
          type: string
        emoji:
          type: string
        status:
          type: string
        chartCount:
          type: integer
        draftCount:
          type: integer
        publishedCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        drdUpdatedAt:
          type: string
          nullable: true
          description: |
            ISO timestamp of the most recent DRD upload for this CE, or
            null if no DRD has been uploaded. Surfaced in the library
            list so the UI can flag stale research without an extra
            per-CE round trip.
        archivedAt:
          type: string
          nullable: true
          description: |
            ISO timestamp when this CE was soft-deleted, or null if
            live. Soft-deleted CEs are hidden from the default
            `listCes` response and surfaced via `?archived=true` for
            the Archive tab.
      required:
        - id
        - slug
        - name
        - city
        - country
        - category
        - summary
        - emoji
        - status
        - chartCount
        - draftCount
        - publishedCount
        - createdAt
        - updatedAt
    Chart:
      type: object
      properties:
        id:
          type: integer
        ceId:
          type: integer
        slug:
          type: string
        question:
          type: string
        title:
          type: string
        subtitle:
          type: string
        insight:
          type: string
        chartType:
          type: string
        spec:
          type: object
          additionalProperties: true
        status:
          type: string
        provenance:
          type: object
          nullable: true
          additionalProperties: true
        lastEditedByWriterAt:
          type: string
          nullable: true
        interactive:
          type: boolean
          description: Whether interactive affordances render in embeds. Default true.
        overlayHeadline:
          type: string
          nullable: true
          description: |
            Writer-edited editorial overlay headline shown on the Studio CE
            detail page. Falls back to spec.title when null. Never read by
            embeds.
        overlaySubhead:
          type: string
          nullable: true
          description: |
            Writer-edited editorial overlay subhead. Falls back to
            spec.subtitle when null. Never read by embeds.
        overlayInsight:
          type: string
          nullable: true
          description: |
            Writer-edited editorial overlay key-insight callout copy. Falls
            back to spec.insight when null. Never read by embeds.
        presentation:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Task #151 — render-time presentation overrides applied by chart
            components (palette, view, emphasis, direction, density). Never
            triggers re-generation. Shape mirrors `PresentationOverrides` in
            the viz-studio presentation lib.
        sortOrder:
          type: integer
        openFeedbackCount:
          type: integer
        topFeedbackSeverity:
          type: string
          nullable: true
        editCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ceId
        - slug
        - question
        - title
        - subtitle
        - insight
        - chartType
        - spec
        - status
        - interactive
        - sortOrder
        - createdAt
        - updatedAt
    ChartUpdateInput:
      type: object
      properties:
        question:
          type: string
        title:
          type: string
        subtitle:
          type: string
        insight:
          type: string
        spec:
          type: object
          additionalProperties: true
        interactive:
          type: boolean
        overlayHeadline:
          type: string
          nullable: true
          maxLength: 160
          description: |
            Pass a non-empty string to set, an empty string or null to clear.
        overlaySubhead:
          type: string
          nullable: true
          maxLength: 240
        overlayInsight:
          type: string
          nullable: true
          maxLength: 500
        presentation:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Task #151 — render-time presentation overrides (palette, view,
            emphasis, direction, density). Pass `null` to clear. Allowed on
            locked CEs (does not modify the chart spec).
        writerId:
          type: string
    ChartFactReviewInput:
      type: object
      properties:
        rowId:
          type: string
        status:
          type: string
          enum: [approved, rejected, needs_review]
        reason:
          type: string
        claimOverride:
          type: string
        valueOverride:
          type: string
        writerId:
          type: string
      required:
        - rowId
        - status
    ChartPublishInput:
      type: object
      properties:
        status:
          type: string
          enum: [draft, published]
        writerId:
          type: string
      required:
        - status
    RegenerateFeedbackInput:
      type: object
      properties:
        feedback:
          type: string
          maxLength: 4000
        feedbackContext:
          type: object
          description: |
            Structured chart-feedback context for inline "Send & regenerate"
            actions. When `chartFeedbackId` is provided, the server marks the
            referenced feedback row as `resolved` after a successful
            regeneration so it drops out of Triage.
          properties:
            chartFeedbackId:
              type: integer
            note:
              type: string
              maxLength: 2000
            issueCategory:
              type: string
              maxLength: 80
    TopicChartInput:
      type: object
      properties:
        topic:
          type: string
        archetype:
          type: string
        pastedData:
          type: string
        sourceUrl:
          type: string
        writerId:
          type: string
        force:
          type: boolean
          description: |
            Skip the duplicate-detection short-circuit. When `true`, the
            server creates the chart even if it matches an existing chart
            on the same CE, and stamps `provenance.kept_as_duplicate_of`
            with the matched chart id so it won't be re-flagged.
      required:
        - topic
    DuplicateChartPayload:
      type: object
      description: |
        Body returned with HTTP 409 from `createChartFromTopic` when the
        writer's topic + recommended archetype matches an existing chart
        on the same CE. Also embedded in `FeasibilityVerdict.duplicate_of`.
      properties:
        error:
          type: string
          description: Always `"duplicate_chart"`.
        duplicate_of:
          type: object
          properties:
            chartId:
              type: integer
            chartSlug:
              type: string
            chartTitle:
              type: string
            chartType:
              type: string
            matchType:
              type: string
              enum: [archetype_intent, archetype_fuzzy, question_only]
            similarity:
              type: number
            reason:
              type: string
            mergeAllowed:
              type: boolean
              description: |
                False for curated/locked CEs — the merge action must be
                disabled in the UI so hand-curated chart specs stay
                canonical.
          required:
            - chartId
            - chartSlug
            - chartTitle
            - chartType
            - matchType
            - similarity
            - reason
            - mergeAllowed
      required:
        - error
        - duplicate_of
    MergeSuggestionInput:
      type: object
      description: |
        Body for `POST /charts/{id}/merge-suggestion` — fold a writer's
        new inputs into an existing chart instead of creating a duplicate.
        All fields optional; the server requires at least one non-empty
        value. Locked CEs reject with 409.
      properties:
        question:
          type: string
          minLength: 2
          maxLength: 280
        pastedData:
          type: string
          maxLength: 20000
          description: |
            When supplied, the server re-runs the per-archetype generator
            against the merged inputs so the chart spec reflects the new
            numbers.
        sourceUrl:
          type: string
          maxLength: 800
          description: |
            Dedupe-appended into `provenance.web_sources`.
        insight:
          type: string
          maxLength: 400
        subtitle:
          type: string
          maxLength: 200
        writerId:
          type: string
          maxLength: 120
    VerifyAllResult:
      type: object
      properties:
        verified:
          type: integer
          description: Number of charts that were verified in this run.
        skipped:
          type: integer
          description: Number of charts already verified (skipped).
        failed:
          type: integer
          description: Number of charts where the verifier call failed.
        reason:
          type: string
          description: Human-readable note when the whole run was skipped (e.g. verifier not configured).
      required:
        - verified
        - skipped
        - failed
    RegenerateStaleResult:
      type: object
      properties:
        regenerated:
          type: integer
          description: Number of charts successfully regenerated.
        stale_ids:
          type: array
          items:
            type: integer
          description: IDs of all charts that were identified as stale.
        failed:
          type: integer
          description: Number of stale charts that failed to regenerate.
        failed_ids:
          type: array
          items:
            type: integer
          description: IDs of charts that failed to regenerate.
      required:
        - regenerated
        - stale_ids
        - failed
        - failed_ids
    PublishAllDraftsInput:
      type: object
      properties:
        writerId:
          type: string
    PublishAllDraftsResult:
      type: object
      properties:
        published:
          type: integer
      required:
        - published
    ChartVerification:
      type: object
      properties:
        status:
          type: string
          enum: [ok, issues, skipped]
        issues:
