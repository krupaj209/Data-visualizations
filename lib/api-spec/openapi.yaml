openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ces
    description: Combined Entity (attraction/experience) operations
  - name: charts
    description: Chart operations
  - name: drds
    description: Deep Research Document upload and retrieval
  - name: research
    description: Research-grounded chart generation pipeline
  - name: feedback
    description: Chart feedback loop and triage
  - name: ce-intelligence
    description: Per-CE intelligence profile built from multi-source adapters
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ces:
    get:
      operationId: listCes
      tags: [ces]
      summary: List all CEs
      responses:
        "200":
          description: List of CEs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ce"
    post:
      operationId: createCe
      tags: [ces]
      summary: Create a CE and generate its chart suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}:
    get:
      operationId: getCe
      tags: [ces]
      summary: Get a CE with its charts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateFeedbackInput"
      responses:
        "200":
          description: CE with charts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCe
      tags: [ces]
      summary: Delete a CE and its charts
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/regenerate:
    post:
      operationId: regenerateCe
      tags: [ces]
      summary: Replace this CE's charts with a freshly generated set
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeWithCharts"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds/{ceSlug}:
    get:
      operationId: getDrd
      tags: [drds]
      summary: Get the latest DRD uploaded for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DRD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDrd
      tags: [drds]
      summary: Delete the DRD for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /drds:
    post:
      operationId: uploadDrd
      tags: [drds]
      summary: Upload or replace the DRD for a CE (markdown JSON or PDF multipart)
      description: |
        Two ways to upload:
          1. application/json with `{ ceSlug, markdown, sourceFilename?, sources? }`
          2. multipart/form-data with `ceSlug` and a `file` field (PDF). The
             multipart variant is intentionally omitted from the OpenAPI spec
             because Orval's Zod generator can't model a binary `Blob` body in
             a Node typecheck context. Use plain `fetch` with `FormData` for
             PDF uploads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrdMarkdownUpload"
      responses:
        "201":
          description: Created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drd"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /research/subcategories:
    get:
      operationId: listSubcategories
      tags: [research]
      summary: List the supported subcategories with their descriptions
      responses:
        "200":
          description: Subcategory list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
  /research/generate:
    post:
      operationId: generateFromResearch
      tags: [research]
      summary: Run the research-grounded pipeline to produce a draft deck
      description: |
        Subcategory ids that aren't in the curated bank are accepted and
        bootstrapped as `unratified` — only cross-cutting and DRD-derived
        hero questions are used. Locked curated CEs (Florence cluster)
        return 409 to protect their hand-curated decks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchGenerateInput"
      responses:
        "201":
          description: Draft deck created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchGenerateResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for the CE yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Pipeline failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}:
    get:
      operationId: getCeIntelligence
      tags: [ce-intelligence]
      summary: Get the persisted intelligence profile for a CE
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Intelligence profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "404":
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}/refresh:
    post:
      operationId: refreshCeIntelligence
      tags: [ce-intelligence]
      summary: Refresh the intelligence profile (all sources or a subset)
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeIntelligenceRefreshInput"
      responses:
        "200":
          description: Refreshed profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ce-intelligence/{ceSlug}/sources/{source}:
    delete:
      operationId: deleteCeIntelligenceSource
      tags: [ce-intelligence]
      summary: Drop all facts attributed to a single source
      parameters:
        - in: path
          name: ceSlug
          required: true
          schema:
            type: string
        - in: path
          name: source
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeIntelligence"
        "400":
          description: Invalid source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}:
    get:
      operationId: getChart
      tags: [charts]
      summary: Get a single chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateFeedbackInput"
      responses:
        "200":
          description: Chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateChart
      tags: [charts]
      summary: Writer edits a chart's header copy and/or spec
      description: |
        Updates title/subtitle/insight and logs a chart_edits row. The edit
        row counts as a 0.25-weight implicit signal in the trouble score.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartUpdateInput"
      responses:
        "200":
          description: Updated chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid spec or fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/regenerate:
    post:
      operationId: regenerateChart
      tags: [charts]
      summary: Regenerate the spec for a single chart
      description: |
        Re-runs the research pipeline for just this chart, replacing its spec
        in place. Requires a DRD uploaded for the CE. Locked CEs return 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartWithCe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CE is locked from automated regeneration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for the CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Pipeline failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/verify:
    post:
      operationId: verifyChart
      tags: [charts]
      summary: Re-verify the chart against the CE's DRD + a fresh web check
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartVerification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          description: No DRD uploaded for this CE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/feedback:
    get:
      operationId: listChartFeedback
      tags: [feedback]
      summary: List feedback for a single chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartFeedback"
    post:
      operationId: createChartFeedback
      tags: [feedback]
      summary: Submit feedback on a chart
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartFeedbackInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartFeedback"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Chart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /charts/{id}/publish:
    post:
      operationId: publishChart
      tags: [charts]
      summary: Flip a draft chart to published (or back to draft)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartPublishInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/charts:
    post:
      operationId: createChartFromTopic
      tags: [charts]
      summary: Generate a new draft chart for a CE from a writer's topic
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicChartInput"
      responses:
        "201":
          description: Draft chart created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chart"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /feedback:
    get:
      operationId: listAllFeedback
      tags: [feedback]
      summary: List feedback across all charts (for triage)
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Triage feedback rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TriageFeedback"
  /feedback/{id}:
    patch:
      operationId: updateFeedback
      tags: [feedback]
      summary: Update a feedback row's status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartFeedback"
        "404":
          description: Not found
  /ces/{slug}/publish-all-drafts:
    post:
      operationId: publishAllDrafts
      tags: [charts]
      summary: Bulk-publish every draft chart for a CE
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishAllDraftsInput"
      responses:
        "200":
          description: Bulk publish summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishAllDraftsResult"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /ces/{slug}/ideation:
    get:
      operationId: getIdeation
      tags: [ces]
      summary: Get the ideation chatbot transcript for a CE
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IdeationMessage"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: postIdeation
      tags: [ces]
      summary: Send a writer message to the ideation chatbot
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeationInput"
      responses:
        "200":
          description: Assistant reply (with optional structured proposals)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeationMessage"
        "404":
          description: CE not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Ideation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearIdeation
      tags: [ces]
      summary: Clear the ideation chatbot transcript
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cleared
  /triage/questions:
    get:
      operationId: listQuestionTroubleScores
      tags: [feedback]
      summary: List per-question trouble scores aggregated from feedback
      responses:
        "200":
          description: Trouble scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionTroubleScore"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Ce:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        country:
          type: string
        category:
          type: string
        summary:
          type: string
        emoji:
          type: string
        status:
          type: string
        chartCount:
          type: integer
        draftCount:
          type: integer
        publishedCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - name
        - city
        - country
        - category
        - summary
        - emoji
        - status
        - chartCount
        - draftCount
        - publishedCount
        - createdAt
        - updatedAt
    Chart:
      type: object
      properties:
        id:
          type: integer
        ceId:
          type: integer
        slug:
          type: string
        question:
          type: string
        title:
          type: string
        subtitle:
          type: string
        insight:
          type: string
        chartType:
          type: string
        spec:
          type: object
          additionalProperties: true
        status:
          type: string
        provenance:
          type: object
          nullable: true
          additionalProperties: true
        lastEditedByWriterAt:
          type: string
          nullable: true
        interactive:
          type: boolean
          description: Whether interactive affordances render in embeds. Default true.
        sortOrder:
          type: integer
        openFeedbackCount:
          type: integer
        topFeedbackSeverity:
          type: string
          nullable: true
        editCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - ceId
        - slug
        - question
        - title
        - subtitle
        - insight
        - chartType
        - spec
        - status
        - interactive
        - sortOrder
        - createdAt
        - updatedAt
    ChartUpdateInput:
      type: object
      properties:
        question:
          type: string
        title:
          type: string
        subtitle:
          type: string
        insight:
          type: string
        spec:
          type: object
          additionalProperties: true
        interactive:
          type: boolean
        writerId:
          type: string
    ChartPublishInput:
      type: object
      properties:
        status:
          type: string
          enum: [draft, published]
        writerId:
          type: string
      required:
        - status
    RegenerateFeedbackInput:
      type: object
      properties:
        feedback:
          type: string
          maxLength: 4000
    TopicChartInput:
      type: object
      properties:
        topic:
          type: string
        archetype:
          type: string
        pastedData:
          type: string
        sourceUrl:
          type: string
        writerId:
          type: string
      required:
        - topic
    PublishAllDraftsInput:
      type: object
      properties:
        writerId:
          type: string
    PublishAllDraftsResult:
      type: object
      properties:
        published:
          type: integer
      required:
        - published
    ChartVerification:
      type: object
      properties:
        status:
          type: string
          enum: [ok, issues, skipped]
        issues:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string
        suggestedSpec:
          type: object
          nullable: true
          additionalProperties: true
        verifierNotes:
          type: string
      required:
        - status
        - issues
        - suggestions
        - verifierNotes
    IdeationMessage:
      type: object
      properties:
        id:
          type: integer
        ceId:
          type: integer
        role:
          type: string
        content:
          type: string
        proposals:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - ceId
        - role
        - content
        - createdAt
    IdeationInput:
      type: object
      properties:
        message:
          type: string
        writerId:
          type: string
      required:
        - message
    ChartWithCe:
      type: object
      properties:
        chart:
          $ref: "#/components/schemas/Chart"
        ce:
          $ref: "#/components/schemas/Ce"
      required:
        - chart
        - ce
    CeWithCharts:
      type: object
      properties:
        ce:
          $ref: "#/components/schemas/Ce"
        charts:
          type: array
          items:
            $ref: "#/components/schemas/Chart"
      required:
        - ce
        - charts
    Drd:
      type: object
      properties:
        id:
          type: integer
        ceSlug:
          type: string
        sourceType:
          type: string
        sourceFilename:
          type: string
          nullable: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        markdownPreview:
          type: string
        markdownLength:
