      type: object
      properties:
        message:
          type: string
        writerId:
          type: string
      required:
        - message
    FeasibilityVerdict:
      type: object
      description: |
        Structured feasibility check for a proposed chart topic. Returned
        by `POST /ces/{slug}/ideation/feasibility` and persisted on the
        assistant turn so the panel can re-render verdict cards from
        history.
      properties:
        verdict:
          type: string
          enum: [ready, needs_more, out_of_scope]
        topic:
          type: string
          description: The writer-supplied topic (normalised, sentence case).
        question:
          type: string
          description: Visitor-facing question the chart would answer.
        archetype:
          type: string
          description: Recommended chart archetype id.
        rationale:
          type: string
          description: One- or two-sentence explanation of the verdict.
        missing_data:
          type: array
          description: |
            Specific data points the writer needs to supply for a
            `needs_more` verdict. Empty for `ready`/`out_of_scope`.
          items:
            type: object
            properties:
              label:
                type: string
              hint:
                type: string
            required:
              - label
        drd_snippets:
          type: array
          items:
            type: string
        web_sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
            required:
              - title
              - url
        generated_chart_id:
          type: integer
          nullable: true
          description: |
            Set once the writer clicks "Generate this chart" and the draft
            is created. Lets the transcript deep-link to the draft card.
        duplicate_of:
          nullable: true
          description: |
            Populated when the verdict's archetype + question matches an
            existing chart on this CE. The UI surfaces a "Looks like a
            duplicate" banner with Open / Merge / Create-anyway actions.
          type: object
          properties:
            chartId:
              type: integer
            chartSlug:
              type: string
            chartTitle:
              type: string
            chartType:
              type: string
            matchType:
              type: string
              enum: [archetype_intent, archetype_fuzzy, question_only]
            similarity:
              type: number
            reason:
              type: string
            mergeAllowed:
              type: boolean
          required:
            - chartId
            - chartSlug
            - chartTitle
            - chartType
            - matchType
            - similarity
            - reason
            - mergeAllowed
      required:
        - verdict
        - topic
        - rationale
        - missing_data
        - drd_snippets
        - web_sources
    IdeationFeasibilityInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        contextText:
          type: string
      required:
        - topic
    IdeationGenerateChartInput:
      type: object
      properties:
        messageId:
          type: integer
          description: |
            Optional id of the assistant turn that produced the
            feasibility verdict. The new chart's provenance carries this
            so writers can trace it back, and the turn is updated with
            `generated_chart_id`.
        topic:
          type: string
        question:
