kind = "web"
previewPath = "/studio/"
title = "Viz Studio"
version = "1.0.0"
id = "artifacts/viz-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/studio/" ]
localPort = 20563

[services.development]
run = "pnpm --filter @workspace/viz-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/viz-studio", "run", "build" ]
publicDir = "artifacts/viz-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20563"
BASE_PATH = "/studio/"
