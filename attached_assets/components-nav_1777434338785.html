<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Nav Bar</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .wrap{padding:20px;}
  .nav{background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow-xs);}
  .logo img{height:22px;display:block;}
  .search{flex:1;max-width:360px;background:var(--color-slate-50);border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-3);}
  .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--fg-1);}
  .right a{color:inherit;font-weight:500;}
  .btn{background:var(--color-slate-black);color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;border:none;cursor:pointer;font-family:var(--font-display);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <div class="logo"><img src="../assets/logos/headout-purps.svg" alt="Headout"/></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        Search experiences and cities
      </div>
      <div class="right">
        <a>English | USD</a>
        <a>Help</a>
        <button class="btn">Sign in</button>
      </div>
    </div>
  </div>
</body>
</html>
