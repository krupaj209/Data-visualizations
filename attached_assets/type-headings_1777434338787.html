<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Heading Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:22px 26px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:baseline;gap:18px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:120px;flex-shrink:0;}
  .h1{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.2;letter-spacing:-0.015em;color:var(--fg-1);}
  .h2{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.25;letter-spacing:-0.01em;color:var(--fg-1);}
  .h3{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.3;color:var(--fg-1);}
  .h4{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.35;color:var(--fg-1);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="tag">H1 · 32/1.2</div><div class="h1">Only the finest</div></div>
    <div class="row"><div class="tag">H2 · 24/1.25</div><div class="h2">Explore world's top destinations</div></div>
    <div class="row"><div class="tag">H3 · 20/1.3</div><div class="h3">Headout's top recommendations</div></div>
    <div class="row"><div class="tag">H4 · 18/1.35</div><div class="h4">Browse by themes</div></div>
  </div>
</body>
</html>
