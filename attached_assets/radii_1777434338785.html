<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:20px 24px;display:flex;gap:18px;align-items:flex-end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:72px;background:var(--color-purps);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--font-mono);}
  .label{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:center;}
  .pillwrap{display:flex;align-items:center;height:72px;}
  .pill{background:var(--color-purps);color:#fff;font-weight:700;font-size:12px;padding:10px 20px;border-radius:999px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box" style="border-radius:4px">4</div><div class="label">--xs<br/>4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px">8</div><div class="label">--sm<br/>8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px">12</div><div class="label">--md<br/>12px</div></div>
    <div class="item"><div class="box" style="border-radius:16px">16</div><div class="label">--lg<br/>16px</div></div>
    <div class="item"><div class="box" style="border-radius:24px">24</div><div class="label">--xl<br/>24px</div></div>
    <div class="item"><div class="pillwrap"><div class="pill">pill</div></div><div class="label">--pill<br/>999px</div></div>
  </div>
</body>
</html>
