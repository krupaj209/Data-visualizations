<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accademia PYV — Data Visualizations</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    body { margin: 0; background: #f0eee9; font-family: 'Manrope', sans-serif; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="viz.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="hero-stats" title="Hero stats" subtitle="Lead with verified numbers. Paste these high on the PYV page.">
            <DCArtboard id="annual" label="Annual visitors · 520×380" width={520} height={380}>
              <AnnualVisitorsViz />
            </DCArtboard>
            <DCArtboard id="capacity" label="Capacity dial · 460×280" width={460} height={280}>
              <CapacityViz />
            </DCArtboard>
          </DCSection>

          <DCSection id="buying" title="Buying the right ticket" subtitle="The wedge — shows why the official site alone isn't the cheapest or fastest path.">
            <DCArtboard id="ticket-compare" label="Ticket comparison · 520×360" width={520} height={360}>
              <TicketCompareViz />
            </DCArtboard>
            <DCArtboard id="booking-lead" label="Booking lead time · 520×280" width={520} height={280}>
              <BookingLeadViz />
            </DCArtboard>
          </DCSection>

          <DCSection id="timing" title="When to go" subtitle="Three scales — time of day, day of week, month of year. Each labelled for data quality.">
            <DCArtboard id="time-of-day" label="Time of day · 520×280" width={520} height={280}>
              <TimeOfDayViz />
            </DCArtboard>
            <DCArtboard id="day-of-week" label="Day of week · 520×300" width={520} height={300}>
              <DayOfWeekViz />
            </DCArtboard>
            <DCArtboard id="monthly" label="Monthly curve · 520×340" width={520} height={340}>
              <MonthlyCurveViz />
            </DCArtboard>
          </DCSection>

          <DCSection id="inside" title="Inside the visit" subtitle="What happens after the turnstile — plus what else ends up in the cart.">
            <DCArtboard id="duration" label="Visit duration · 520×280" width={520} height={280}>
              <DurationViz />
            </DCArtboard>
            <DCArtboard id="also-booked" label="Also booked with · 520×340" width={520} height={340}>
              <AlsoBookedViz />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
