<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Background Tints</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .sw{border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;color:#000;border:1px solid var(--border-1);}
  .name{font-weight:700;font-size:12px;letter-spacing:-0.01em;line-height:1.1;}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.7;margin-top:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#FFF8EF"><div class="name">Cream</div><div class="hex">#FFF8EF</div></div>
    <div class="sw" style="background:#FFC7CC"><div class="name">Peach</div><div class="hex">#FFC7CC</div></div>
    <div class="sw" style="background:#D2FDEB"><div class="name">Mint</div><div class="hex">#D2FDEB</div></div>
    <div class="sw" style="background:#DBF9DB"><div class="name">Sage</div><div class="hex">#DBF9DB</div></div>
    <div class="sw" style="background:#FFE2F8"><div class="name">Blush</div><div class="hex">#FFE2F8</div></div>
    <div class="sw" style="background:#FFD9D8"><div class="name">Pink</div><div class="hex">#FFD9D8</div></div>
    <div class="sw" style="background:#F3F6FF"><div class="name">Lilac</div><div class="hex">#F3F6FF</div></div>
  </div>
</body>
</html>
