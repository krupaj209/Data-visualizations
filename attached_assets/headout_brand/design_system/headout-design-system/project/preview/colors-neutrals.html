<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(9,1fr);gap:8px;}
  .sw{border-radius:10px;padding:8px;min-height:88px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;}
  .sw.lt{color:#000;border:1px solid var(--border-1);}
  .name{font-weight:700;font-size:11px;letter-spacing:-0.01em;line-height:1.1;}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.75;margin-top:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#0F0F10"><div class="name">950</div><div class="hex">#0F0F10</div></div>
    <div class="sw" style="background:#222222"><div class="name">900</div><div class="hex">#222222</div></div>
    <div class="sw" style="background:#444444"><div class="name">800</div><div class="hex">#444444</div></div>
    <div class="sw" style="background:#666666"><div class="name">700</div><div class="hex">#666666</div></div>
    <div class="sw" style="background:#888888"><div class="name">600</div><div class="hex">#888888</div></div>
    <div class="sw lt" style="background:#A6A6A6"><div class="name">500</div><div class="hex">#A6A6A6</div></div>
    <div class="sw lt" style="background:#C2C2C2"><div class="name">400</div><div class="hex">#C2C2C2</div></div>
    <div class="sw lt" style="background:#E6E6E9"><div class="name">200</div><div class="hex">#E6E6E9</div></div>
    <div class="sw lt" style="background:#F8F8F8"><div class="name">50</div><div class="hex">#F8F8F8</div></div>
  </div>
</body>
</html>
