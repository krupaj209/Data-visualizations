<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Imagery</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .img{aspect-ratio:1/1;border-radius:12px;background-size:cover;background-position:center;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="img" style="background-image:url('../assets/images/exp-acropolis.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/exp-harrypotter.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/exp-dubai-safari.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/exp-phantom.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/city-paris.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/city-london.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/city-rome.jpg')"></div>
    <div class="img" style="background-image:url('../assets/images/city-dubai.jpg')"></div>
  </div>
</body>
</html>
