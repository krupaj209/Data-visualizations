<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Secondary Palette</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:18px 20px;display:grid;grid-template-columns:repeat(8,1fr);gap:10px;}
  .sw{border-radius:12px;padding:10px;min-height:90px;display:flex;flex-direction:column;justify-content:flex-end;color:#000;}
  .sw.dk{color:#fff;}
  .name{font-weight:700;font-size:12px;letter-spacing:-0.01em;line-height:1.1;}
  .hex{font-family:var(--font-mono);font-size:10px;opacity:.75;margin-top:2px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#FFD1DB"><div class="name">Dreamy Pale</div><div class="hex">#FFD1DB</div></div>
    <div class="sw" style="background:#FF9D7C"><div class="name">Peachy</div><div class="hex">#FF9D7C</div></div>
    <div class="sw" style="background:#FFBC00"><div class="name">Joy Mustard</div><div class="hex">#FFBC00</div></div>
    <div class="sw" style="background:#FF9800"><div class="name">Hola</div><div class="hex">#FF9800</div></div>
    <div class="sw" style="background:#CDF280"><div class="name">Sub Green</div><div class="hex">#CDF280</div></div>
    <div class="sw dk" style="background:#15D876"><div class="name">Okay Green</div><div class="hex">#15D876</div></div>
    <div class="sw dk" style="background:#00CCEB"><div class="name">Ocean</div><div class="hex">#00CCEB</div></div>
    <div class="sw dk" style="background:#1335F0"><div class="name">Link Blue</div><div class="hex">#1335F0</div></div>
  </div>
</body>
</html>
