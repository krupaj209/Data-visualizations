<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Experience Card</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-2);}
  .wrap{padding:24px;display:flex;gap:18px;}
  .card{width:260px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out);font-family:var(--font-text);}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .img{aspect-ratio:4/2.5;background-size:cover;background-position:center;position:relative;}
  .badge{position:absolute;top:10px;left:10px;background:#fff;color:var(--fg-1);font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px;box-shadow:var(--shadow-xs);}
  .heart{position:absolute;top:10px;right:10px;width:28px;height:28px;background:rgba(255,255,255,.92);border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg-1);}
  .heart svg{width:14px;height:14px;}
  .body{padding:12px 14px 14px;}
  .city{font-size:12px;color:var(--fg-3);margin-bottom:4px;}
  .title{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.25;color:var(--fg-1);margin:0 0 8px;letter-spacing:-0.01em;}
  .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);margin-bottom:8px;}
  .rating{background:var(--color-purps);color:#fff;padding:2px 6px;border-radius:4px;font-weight:700;font-size:11px;}
  .price{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--fg-1);}
  .from{font-size:12px;color:var(--fg-3);font-weight:400;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="img" style="background-image:url('../assets/images/exp-acropolis.jpg')">
        <div class="badge">Free cancellation</div>
        <div class="heart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      </div>
      <div class="body">
        <div class="city">Athens</div>
        <h3 class="title">Acropolis &amp; Parthenon Tickets with Audio Guide</h3>
        <div class="meta"><span class="rating">4.4</span><span>39,128</span></div>
        <div><span class="from">from</span> <span class="price">$42.31</span></div>
      </div>
    </div>

    <div class="card">
      <div class="img" style="background-image:url('../assets/images/exp-harrypotter.jpg')">
        <div class="badge" style="background:var(--color-candy);color:#fff;">Selling out fast</div>
        <div class="heart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      </div>
      <div class="body">
        <div class="city">London</div>
        <h3 class="title">Harry Potter™ Warner Bros. Studio Tour with Transfers</h3>
        <div class="meta"><span class="rating">4.5</span><span>10,616</span></div>
        <div><span class="from">from</span> <span class="price">$107.93</span> <span class="from" style="text-decoration:line-through">$134.91</span></div>
      </div>
    </div>
  </div>
</body>
</html>
