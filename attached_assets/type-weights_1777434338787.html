<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Headout — Type Weights</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;padding:0;background:var(--bg-1);}
  .wrap{padding:22px 26px;display:flex;flex-direction:column;gap:6px;}
  .row{font-family:var(--font-display);font-size:28px;line-height:1.25;letter-spacing:-0.015em;color:var(--fg-1);display:flex;align-items:baseline;gap:20px;}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:100px;flex-shrink:0;font-weight:400;text-transform:none;letter-spacing:0;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="tag">400 Regular</div><div style="font-weight:400">Experience every flavour</div></div>
    <div class="row"><div class="tag">500 Medium</div><div style="font-weight:500">Experience every flavour</div></div>
    <div class="row"><div class="tag">600 Semibold</div><div style="font-weight:600">Experience every flavour</div></div>
    <div class="row"><div class="tag">700 Bold</div><div style="font-weight:700">Experience every flavour</div></div>
    <div class="row"><div class="tag">800 ExtraBold</div><div style="font-weight:800">Experience every flavour</div></div>
  </div>
</body>
</html>
